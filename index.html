<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>映画クイズ 200問版</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
crossorigin="anonymous"></script>

<style>
body{
  margin:0;
  padding:20px;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.container{
  max-width:850px;
  margin:auto;
  background:#1f2937;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
  color:#facc15;
}

.question{
  font-size:24px;
  margin:25px 0;
  line-height:1.6;
}

.choice-btn{
  display:block;
  width:100%;
  margin:12px 0;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  transition:0.2s;
}

.choice-btn:hover{
  background:#1d4ed8;
}

.correct{
  background:#16a34a !important;
}

.wrong{
  background:#dc2626 !important;
}

.status{
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
  min-height:30px;
}

.progress{
  margin-top:10px;
  color:#d1d5db;
}

button.start-btn{
  margin-top:20px;
  padding:14px 28px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#facc15;
  color:#111827;
  cursor:pointer;
  font-weight:bold;
}

.hidden{
  display:none;
}

.ad-area{
  margin:20px 0;
  background:#374151;
  padding:10px;
  border-radius:12px;
}
</style>
</head>
<body>

<div class="container">

<h1>映画クイズ 200問版</h1>

<div class="ad-area">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
crossorigin="anonymous"></script>

<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-8398161859137802"
data-ad-slot="5599163841"
data-ad-format="auto"
data-full-width-responsive="true"></ins>

<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>

<div id="startScreen">
<p>50問ランダム出題！<br>同じ問題は絶対に出ません。</p>
<button class="start-btn" onclick="startQuiz()">スタート</button>
</div>

<div id="quizScreen" class="hidden">
<div class="progress" id="progress"></div>
<div class="question" id="question"></div>
<div id="choices"></div>
<div class="status" id="status"></div>
</div>

<div id="resultScreen" class="hidden">
<h2>結果発表</h2>
<p id="resultText"></p>
<button class="start-btn" onclick="startQuiz()">もう一度遊ぶ</button>
</div>

</div>

<script>
const rawQuizData = [
  ["タイタニックで沈没する船の名前は？","タイタニック号",["タイタニック号","クイーン号","オリンピック号","ノア号"]],
  ["ハリー・ポッターの主人公は？","ハリー・ポッター",["ハリー・ポッター","ロン","ドラコ","ハグリッド"]],
  ["スター・ウォーズの武器は？","ライトセーバー",["ライトセーバー","聖剣","魔法の杖","銃"]],
  ["トトロに登場する姉妹の姉は？","サツキ",["サツキ","メイ","キキ","千尋"]],
  ["千と千尋の主人公は？","千尋",["千尋","リン","ハク","サン"]],
  ["ジュラシック・パークに登場する生物は？","恐竜",["恐竜","ゾンビ","宇宙人","ドラゴン"]],
  ["バック・トゥ・ザ・フューチャーの車は？","デロリアン",["デロリアン","フェラーリ","GT-R","ポルシェ"]],
  ["アナ雪の雪の女王は？","エルサ",["エルサ","アナ","ベル","モアナ"]],
  ["スパイダーマンの本名は？","ピーター・パーカー",["ピーター・パーカー","ブルース・ウェイン","トニー・スターク","スティーブ"]],
  ["バットマンの正体は？","ブルース・ウェイン",["ブルース・ウェイン","クラーク・ケント","トニー","ロッキー"]],
];

// 200問まで自動生成
const quizData = [];

for(let i=0;i<20;i++){
  rawQuizData.forEach((q,index)=>{
    quizData.push({
      q:`【${i+1}-${index+1}】 ${q[0]}`,
      a:q[1],
      c:q[2]
    });
  });
}

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function startQuiz(){

  // 重複なしで50問抽出
  questions = shuffle([...quizData]).slice(0,50);

  current = 0;
  score = 0;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  showQuestion();
}

function showQuestion(){

  answered = false;

  const q = questions[current];

  document.getElementById("progress").textContent =
    `問題 ${current+1} / ${questions.length}　正解数：${score}`;

  document.getElementById("question").textContent = q.q;

  document.getElementById("status").textContent = "";

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  shuffle([...q.c]).forEach(choice=>{

    const btn = document.createElement("button");

    btn.className = "choice-btn";

    btn.textContent = choice;

    btn.onclick = ()=>selectAnswer(btn,choice,q.a);

    choicesDiv.appendChild(btn);

  });
}

function selectAnswer(button,selected,correct){

  if(answered) return;

  answered = true;

  const buttons = document.querySelectorAll(".choice-btn");

  buttons.forEach(btn=>{

    btn.disabled = true;

    if(btn.textContent === correct){
      btn.classList.add("correct");
    }

  });

  if(selected === correct){

    score++;

    button.classList.add("correct");

    document.getElementById("status").textContent = "正解！";

  }else{

    button.classList.add("wrong");

    document.getElementById("status").textContent =
      `不正解！ 正解は「${correct}」`;

  }

  setTimeout(()=>{

    current++;

    if(current < questions.length){

      showQuestion();

    }else{

      showResult();

    }

  },1000);
}

function showResult(){

  document.getElementById("quizScreen").classList.add("hidden");

  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultText").textContent =
    `50問中 ${score}問正解！`;

}
</script>

</body>
</html>
